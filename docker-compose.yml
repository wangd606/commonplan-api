services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhitong}
      POSTGRES_USER: ${POSTGRES_USER:-zhitong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhitong}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhitong} -d ${POSTGRES_DB:-zhitong}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-zhitong}
      POSTGRES_USER: ${POSTGRES_USER:-zhitong}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-zhitong_auth}
    volumes:
      - ./scripts/ensure-auth-database.sh:/scripts/ensure-auth-database.sh:ro
    command: ["/scripts/ensure-auth-database.sh"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-migrate:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhitong:zhitong@db:5432/zhitong}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-migrate:
    build:
      context: ./auth_service
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+psycopg://zhitong:zhitong@db:5432/zhitong_auth}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./auth_service
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+psycopg://zhitong:zhitong@db:5432/zhitong_auth}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${AUTH_SESSION_SECRET:-${SESSION_SECRET:-local-dev-auth-state-change-me}}
      ISSUER: ${AUTH_ISSUER:-http://localhost:8001}
      AUDIENCE: ${AUTH_AUDIENCE:-zhitong-api}
      CLIENT_ID: ${AUTH_CLIENT_ID:-zhitong-web}
      INTERNAL_CLIENT_SECRET: ${AUTH_INTERNAL_CLIENT_SECRET:-local-dev-bff-client-change-me}
      BFF_CALLBACK_URL: ${BFF_CALLBACK_URL:-http://localhost:8000/auth/google/complete}
      LOGIN_CODE_MAX_AGE_SECONDS: ${LOGIN_CODE_MAX_AGE_SECONDS:-60}
      SIGNING_KEY_ID: ${AUTH_SIGNING_KEY_ID:-local-dev-1}
      PRIVATE_KEY_PATH: /var/lib/zhitong-auth/keys/private.pem
      PUBLIC_KEY_PATH: /var/lib/zhitong-auth/keys/public.pem
      ACCESS_TOKEN_MAX_AGE_SECONDS: ${ACCESS_TOKEN_MAX_AGE_SECONDS:-900}
      REFRESH_TOKEN_MAX_AGE_SECONDS: ${REFRESH_TOKEN_MAX_AGE_SECONDS:-2592000}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-zhitong_oauth_state}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--no-access-log"]
    volumes:
      - ./auth_service/app:/app/app
      - ./auth_service/alembic:/app/alembic
      - ./auth_service/alembic.ini:/app/alembic.ini
      - auth_signing_keys:/var/lib/zhitong-auth/keys
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhitong:zhitong@db:5432/zhitong}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-zhitong-api}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-zhitong-web}
      AUTH_JWKS_URL: http://auth-service:8001/.well-known/jwks.json
      AUTH_INTERNAL_URL: http://auth-service:8001
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8001}
      AUTH_INTERNAL_CLIENT_SECRET: ${AUTH_INTERNAL_CLIENT_SECRET:-local-dev-bff-client-change-me}
      AUTH_ACCESS_TOKEN_MAX_AGE_SECONDS: ${ACCESS_TOKEN_MAX_AGE_SECONDS:-900}
      REFRESH_TOKEN_MAX_AGE_SECONDS: ${REFRESH_TOKEN_MAX_AGE_SECONDS:-2592000}
      BFF_TOKEN_ENCRYPTION_SECRET: ${BFF_TOKEN_ENCRYPTION_SECRET:-local-dev-refresh-vault-change-me}
      BFF_SESSION_COOKIE_NAME: ${BFF_SESSION_COOKIE_NAME:-zhitong_web_session}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_ALLOWED_OWNER_ID: ${GITHUB_ALLOWED_OWNER_ID:-}
      GITHUB_ALLOWED_OWNER_LOGIN: ${GITHUB_ALLOWED_OWNER_LOGIN:-}
      GITHUB_WORKSPACE_ID: ${GITHUB_WORKSPACE_ID:-}
      GITHUB_HOOK_ID: ${GITHUB_HOOK_ID:-}
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-local}
      OBJECT_STORAGE_LOCAL_PATH: /var/lib/commonplan/attachments
      OBJECT_STORAGE_LOCAL_PUBLIC_URL: ${OBJECT_STORAGE_LOCAL_PUBLIC_URL:-http://localhost:8000}
      OBJECT_STORAGE_SIGNING_SECRET: ${OBJECT_STORAGE_SIGNING_SECRET:-local-dev-file-signing-change-me}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-https://s3.amazonaws.com}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-https://s3.amazonaws.com}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-commonplan-attachments}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-commonplan}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-commonplan-local-secret}
      ATTACHMENT_UPLOAD_MAX_BYTES: ${ATTACHMENT_UPLOAD_MAX_BYTES:-26214400}
      ATTACHMENT_URL_TTL_SECONDS: ${ATTACHMENT_URL_TTL_SECONDS:-900}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - attachment_data:/var/lib/commonplan/attachments
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  ingestion-worker:
    build:
      context: ./backend
      target: ingestion
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhitong:zhitong@db:5432/zhitong}
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-local}
      OBJECT_STORAGE_LOCAL_PATH: /var/lib/commonplan/attachments
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-https://s3.amazonaws.com}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-commonplan-attachments}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-commonplan}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-commonplan-local-secret}
      INGESTION_WORKER_ID: ${INGESTION_WORKER_ID:-ingestion-worker-1}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-5}
      EVENT_BUS_BOOTSTRAP_SERVERS: ${EVENT_BUS_BOOTSTRAP_SERVERS:-redpanda:9092}
      EVENT_BUS_TOPIC: ${EVENT_BUS_TOPIC:-commonplan.knowledge.v1}
      EVENT_BUS_DLQ_TOPIC: ${EVENT_BUS_DLQ_TOPIC:-commonplan.knowledge.dlq.v1}
      EVENT_BUS_CONSUMER_GROUP: ${EVENT_BUS_CONSUMER_GROUP:-commonplan-knowledge-indexer-v1}
      EVENT_BUS_MAX_POLL_INTERVAL_SECONDS: ${EVENT_BUS_MAX_POLL_INTERVAL_SECONDS:-1800}
      EVENT_BUS_SECURITY_PROTOCOL: ${EVENT_BUS_SECURITY_PROTOCOL:-PLAINTEXT}
      EVENT_BUS_SASL_MECHANISM: ${EVENT_BUS_SASL_MECHANISM:-SCRAM-SHA-256}
      EVENT_BUS_SASL_USERNAME: ${EVENT_BUS_SASL_USERNAME:-}
      EVENT_BUS_SASL_PASSWORD: ${EVENT_BUS_SASL_PASSWORD:-}
      INGESTION_ALLOW_UNSCANNED: ${INGESTION_ALLOW_UNSCANNED:-true}
      INGESTION_CHUNK_TOKENS: ${INGESTION_CHUNK_TOKENS:-300}
      INGESTION_CHUNK_OVERLAP_TOKENS: ${INGESTION_CHUNK_OVERLAP_TOKENS:-50}
      INGESTION_DOCLING_MAX_PAGES: ${INGESTION_DOCLING_MAX_PAGES:-500}
      INGESTION_EMBEDDING_PROVIDER: ${INGESTION_EMBEDDING_PROVIDER:-model_gateway}
      INGESTION_EMBEDDING_MODEL: ${INGESTION_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      INGESTION_EMBEDDING_MODEL_REVISION: ${INGESTION_EMBEDDING_MODEL_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      INGESTION_EMBEDDING_DIMENSIONS: ${INGESTION_EMBEDDING_DIMENSIONS:-1024}
      INGESTION_EMBEDDING_BASE_URL: ${INGESTION_EMBEDDING_BASE_URL:-http://embedding-service}
      INGESTION_EMBEDDING_BATCH_SIZE: ${INGESTION_EMBEDDING_BATCH_SIZE:-3}
      INGESTION_EMBEDDING_TIMEOUT_SECONDS: ${INGESTION_EMBEDDING_TIMEOUT_SECONDS:-120}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://model-gateway:4000/v1}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-sk-local-commonplan-change-me}
      MODEL_GATEWAY_EMBEDDING_ALIAS: ${MODEL_GATEWAY_EMBEDDING_ALIAS:-commonplan-embedding-v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["python", "-m", "app.ingestion.worker"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
      - attachment_data:/var/lib/commonplan/attachments
      - docling_cache:/root/.cache
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  debezium:
    image: quay.io/debezium/connect:3.6
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: commonplan-debezium
      CONFIG_STORAGE_TOPIC: commonplan.connect.configs
      OFFSET_STORAGE_TOPIC: commonplan.connect.offsets
      STATUS_STORAGE_TOPIC: commonplan.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  debezium-init:
    image: curlimages/curl:8.16.0
    volumes:
      - ./deploy/debezium/outbox-connector.json:/config/outbox-connector.json:ro
    command:
      - sh
      - -ec
      - |
        until curl --silent --fail http://debezium:8083/connectors; do sleep 2; done
        curl --silent --fail --show-error \
          -X PUT -H 'Content-Type: application/json' \
          --data @/config/outbox-connector.json \
          http://debezium:8083/connectors/commonplan-outbox/config
    depends_on:
      debezium:
        condition: service_healthy

  model-gateway:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:v1.90.2}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-commonplan-change-me}
      TEI_OPENAI_BASE_URL: http://embedding-service/v1
      TEI_API_KEY: ${TEI_API_KEY:-not-required-local}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      embedding-service:
        condition: service_healthy
    restart: unless-stopped

  # Optional local MCP control plane. It intentionally starts with no upstream
  # servers: each GitHub/Slack/custom server needs an explicit auth and tool
  # allowlist review. Start it with: docker compose --profile mcp up -d tool-gateway
  tool-gateway:
    profiles: ["mcp"]
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:v1.90.2}
    command: ["--config", "/app/config.yaml", "--port", "4001"]
    environment:
      LITELLM_MASTER_KEY: ${MCP_GATEWAY_MASTER_KEY:-sk-local-commonplan-mcp-change-me}
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./deploy/litellm/mcp-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  embedding-service:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9}
    command:
      - --model-id
      - ${INGESTION_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --revision
      - ${INGESTION_EMBEDDING_MODEL_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      - --max-client-batch-size
      - ${INGESTION_EMBEDDING_BATCH_SIZE:-3}
      - --max-batch-tokens
      - ${TEI_MAX_BATCH_TOKENS:-1024}
      - --max-concurrent-requests
      - ${TEI_MAX_CONCURRENT_REQUESTS:-8}
      - --tokenization-workers
      - ${TEI_TOKENIZATION_WORKERS:-2}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - embedding_model_cache:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  auth_signing_keys:
  attachment_data:
  docling_cache:
  embedding_model_cache:
  redpanda_data:
